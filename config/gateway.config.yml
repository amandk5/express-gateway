http:
  # port: 8080
  port: 8080
admin:
  port: 9876
  host: localhost

apiEndpoints:
  service1_api:
    host: '*' # <-- REQUIRED FIELD ADDED
    paths:    # <-- FIXED KEY (plural 'paths') & FIXED MATCHING PATTERN
      - '/service1'
      - '/service1/*'
  service2_api:
    host: '*' 
    paths:    
      - '/service2'
      - '/service2/*'

serviceEndpoints:
  service1_backend:
    url: 'https://microservice1.vercel.app'
  service2_backend:
    url: 'https://microservice2.vercel.app'

policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - rate-limit

pipelines:
  service1_pipeline:
    apiEndpoints:
      - service1_api
    policies:
          # Use the built-in expression policy to strip out /service1
      - expression:
          - action:
              jscode: 'req.url = req.url.replace(/^\/service1/, "") || "/";'
      - proxy:
          - action:
              serviceEndpoint: service1_backend
              changeOrigin: true

  service2_pipeline:
    apiEndpoints:
      - service2_api
    policies:
      # Use the built-in expression policy to strip out /service2
      - expression:
          - action:
              jscode: 'req.url = req.url.replace(/^\/service2/, "") || "/";'
      - proxy:
          - action:
              serviceEndpoint: service2_backend
              changeOrigin: true
