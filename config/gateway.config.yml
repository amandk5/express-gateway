# http:
#   port: 8080
# admin:
#   port: 9876
#   host: localhost
# apiEndpoints:
#   # see: http://www.express-gateway.io/docs/configuration/gateway.config.yml/apiEndpoints
# serviceEndpoints:
#   # see: http://www.express-gateway.io/docs/configuration/gateway.config.yml/serviceEndpoints
# policies:
#   - basic-auth
#   - cors
#   - expression
#   - key-auth
#   - log
#   - oauth2
#   - proxy
#   - rate-limit
# pipelines:
#   # see: https://www.express-gateway.io/docs/configuration/gateway.config.yml/pipelines

http:
  port: 8080
admin:
  port: 9876
  host: localhost

apiEndpoints:
  user_api:
    host: '*'
    paths:
      - '/auth'
      - '/auth/*'
  service1_api:
    host: '*' 
    paths:    
      - '/service1'
      - '/service1/*'
  service2_api:
    host: '*' 
    paths:    
      - '/service2'
      - '/service2/*'

serviceEndpoints:
  user_backend:
    url: 'https://user-service-orpin.vercel.app'
  service1_backend:
    url: 'https://microservice1.vercel.app'
  service2_backend:
    url: 'https://microservice2.vercel.app'

policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - rate-limit
  - jwt

pipelines:
  # 1. Public Auth Pipeline
  user_pipeline:
    apiEndpoints:
      - user_api
    policies:
      - cors: 
          - action:
              origin: true 
              methods: 'GET,POST,PUT,DELETE,OPTIONS'
              allowedHeaders: 'Content-Type,Authorization'
              credentials: true
      - expression:
          - action:
              jscode: |
                req.url = req.url.replace(/^\/auth/, "") || "/";
                const _setHeader = res.setHeader;
                res.setHeader = function(name, value) {
                  if (name.toLowerCase() === 'set-cookie') {
                    let cookies = value;
                    if (!Array.isArray(cookies)) cookies = [cookies];
                    cookies = cookies.map(c => {
                      if (!c) return c;
                      let newCookie = c.replace(/SameSite=Lax/i, 'SameSite=None').replace(/Secure=false/i, 'Secure');
                      if (!/SameSite=None/i.test(newCookie)) newCookie += '; SameSite=None';
                      if (!/Secure/i.test(newCookie)) newCookie += '; Secure';
                      return newCookie;
                    });
                    return _setHeader.call(this, name, cookies);
                  }
                  return _setHeader.apply(this, arguments);
                };
      - proxy:
          - action:
              serviceEndpoint: user_backend
              changeOrigin: true

  # 2. Service 1 Pipeline
  service1_pipeline:
    apiEndpoints:
      - service1_api
    policies:
      - cors: 
          - action:
              origin: true 
              methods: 'GET,POST,PUT,DELETE,OPTIONS'
              allowedHeaders: 'Content-Type,Authorization'
              credentials: true
      - expression:
          - action:
              jscode: |
                if (req.headers.cookie) {
                  const match = req.headers.cookie.match(/(?:^|; )\s*token=([^;]+)/);
                  if (match && match[1]) {
                    req.headers.authorization = 'Bearer ' + match[1];
                  }
                }
      - jwt:        
          - action:
              secretOrPublicKey: 'userservice_test_key_123' 
              checkCredentialExistence: false 
      # - expression: # <-- ALIGNED FIX: Shifted left to be a standalone step
      #     - action:
      #         jscode: 'req.url = req.url.replace(/^\/service1/, "") || "/";'
      - proxy:      # <-- ALIGNED FIX: Shifted left to be a standalone step
          - action:
              serviceEndpoint: service1_backend
              changeOrigin: true
              # This rewrites the URL silently in-flight without triggering a browser redirect loop:
              pathRegex: '^\/service1(.*)$'
              to: '$1'              

  # 3. Service 2 Pipeline
  service2_pipeline:
    apiEndpoints:
      - service2_api
    policies:
      - cors: 
          - action:
              origin: true 
              methods: 'GET,POST,PUT,DELETE,OPTIONS'
              allowedHeaders: 'Content-Type,Authorization'
              credentials: true
      - expression:
          - action:
              jscode: |
                if (req.headers.cookie) {
                  const match = req.headers.cookie.match(/(?:^|; )\s*token=([^;]+)/);
                  if (match && match[1]) {
                    req.headers.authorization = 'Bearer ' + match[1];
                  }
                }
      - jwt:        
          - action:
              secretOrPublicKey: 'userservice_test_key_123' 
              checkCredentialExistence: false 
      # - expression: # <-- ALIGNED FIX: Shifted left to be a standalone step
      #     - action:
      #         jscode: 'req.url = req.url.replace(/^\/service2/, "") || "/";'
      - proxy:      # <-- ALIGNED FIX: Shifted left to be a standalone step
          - action:
              serviceEndpoint: service2_backend
              changeOrigin: true
              # This rewrites the URL silently in-flight without triggering a browser redirect loop:
              pathRegex: '^\/service1(.*)$'
              to: '$1'              
